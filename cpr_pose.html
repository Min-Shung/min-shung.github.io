<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CPR Pose Detection Dual View</title>
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <div class="panel">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <button id="toggleVoice" class="voice-btn">
        <i id="voiceIcon" class="fi fi-rr-megaphone"></i>
      </button>

      <button id="switchCamera" class="switch-camera-btn">
        <i class="fi fi-rr-refresh"></i>
      </button>
    </div>

    <div class="panel">
      <video id="demoVideo" autoplay loop muted playsinline src="CPR_demonstration.mov"></video>
      <canvas id="demoCanvas"></canvas>
    </div>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>

  <script src="script.js"></script>
</body>
</html>
